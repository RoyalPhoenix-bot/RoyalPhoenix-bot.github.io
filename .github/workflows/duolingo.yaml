name: Update Duolingo Streak

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Duolingo Streak
        run: |
          STREAK=$(curl -s -A "Mozilla/5.0" "https://www.duolingo.com/2017-06-30/users?username=kushu42&fields=streak" | jq '.users[0].streak // 0')
          echo "{\"streak\": $STREAK}" > duolingo.json

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duolingo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Duolingo streak" && git push)