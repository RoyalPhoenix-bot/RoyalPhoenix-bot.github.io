name: Update Duolingo Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Duolingo Streak
        run: |
          node -e '
            const fs = require("fs");
            async function run() {
              try {
                const res = await fetch("https://www.duolingo.com/2017-06-30/users?username=kushu42&fields=streak", {
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                    "Accept": "application/json"
                  }
                });
                const data = await res.json();
                const streak = data.users?.[0]?.streak ?? 0;
                fs.writeFileSync("duolingo.json", JSON.stringify({ streak }));
                console.log("Successfully retrieved streak:", streak);
              } catch (err) {
                console.error("Error fetching streak:", err);
                process.exit(1);
              }
            }
            run();
          '

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duolingo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Duolingo streak" && git push)