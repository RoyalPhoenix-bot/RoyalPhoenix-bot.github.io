<!--
  blog.html — Blog index.

  Lists every post as a title + one-line summary. The list itself is
  rendered by js/blog.js from the manifest in js/posts.js — this file has
  no hardcoded posts. To publish a new post, edit js/posts.js, not this
  file. See README.md and blogs/README.md for the full workflow.

  Styles:  css/styles.css, css/blog.css
  Scripts: js/script.js (orb), js/posts.js (data), js/blog.js (renders list)
-->
