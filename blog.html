  The list itself is rendered by js/blog.js from the manifest in js/posts.js.
-->

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Blog - Kushagra Sharma." />
<title>Blog — Kushagra</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/blog.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23121212%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2260%22 font-weight=%22bold%22 fill=%22%23ffd700%22 font-family=%22sans-serif%22>K</text></svg>">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="orb" aria-hidden="true"></div>

<header class="topnav">
  <div class="topnav-links">
    <a href="/index" class="topnav-link">Home</a>
    <a href="/blog" class="topnav-link active">Blog</a>
    <a href="/game" class="topnav-link">Quick Dopamine Hit</a>
    <a href="/contact" class="topnav-link">Contact</a>
  </div>
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
</header>

<main class="blog-main">
  <h1 class="page-title">Blog</h1>
  <p class="page-lede">Notes on tech that I find interesting, life, and whatever else I'm chewing on.</p>

  <!-- Toolbar: Category Filter + Search Bar -->
  <div class="blog-toolbar">
    <div class="category-filter-bar">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="Tech">Tech</button>
      <button class="filter-btn" data-category="Life">Life</button>
      <button class="filter-btn" data-category="Peak">Peak</button>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search for keywords or labels in posts" aria-label="Search for keywords or labels in posts" />
      <span class="search-icon" aria-hidden="true">🔍</span>
    </div>
  </div>

  <ul id="post-list" class="post-list"></ul>
</main>

<nav aria-label="Links">
