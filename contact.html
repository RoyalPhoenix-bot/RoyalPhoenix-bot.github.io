<script>
  async function fetchChessStats() {
    try {
      const res = await fetch("https://api.chess.com/pub/player/kushagrasharma1/stats");
      if (!res.ok) throw new Error("Failed to fetch");
      const data = await res.json();
      
      document.getElementById("bullet-rating").textContent = data.chess_bullet?.last?.rating || "N/A";
      document.getElementById("blitz-rating").textContent = data.chess_blitz?.last?.rating || "N/A";
      document.getElementById("rapid-rating").textContent = data.chess_rapid?.last?.rating || "N/A";
      document.getElementById("puzzle-rating").textContent = data.tactics?.highest?.rating || data.tactics?.lowest?.rating || "N/A";
    } catch (e) {
      document.getElementById("bullet-rating").textContent = "—";
      document.getElementById("blitz-rating").textContent = "—";
      document.getElementById("rapid-rating").textContent = "—";
      document.getElementById("puzzle-rating").textContent = "—";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    fetchChessStats();
    initDuolingoStreak("kushu42");
  });
</script>
